<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fond : carre arrondi clair, degrade vertical -->
    <linearGradient id="omnisFond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfefe"/>
      <stop offset="45%" stop-color="#f0f4fa"/>
      <stop offset="100%" stop-color="#d7e0f1"/>
    </linearGradient>

    <!-- Barre de progression : portion remplie -->
    <linearGradient id="omnisBarre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a5ba5"/>
      <stop offset="100%" stop-color="#1d3363"/>
    </linearGradient>

    <!-- Losange bleu de l'axe, pointe vers le haut, centre en (0,0) -->
    <path id="omnisLosange" d="M 0 -168 L 36 -92 L 0 -16 L -36 -92 Z" fill="#3a5ba5"/>

    <!-- Fer de lance sombre en diagonale, oriente vers le haut-droit -->
    <path id="omnisFer" d="M 60 -15 L 60 15 L 136 46 L 136 -46 Z" fill="#081528"/>
  </defs>

  <!-- Boite -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#omnisFond)"/>

  <!-- Etoile a huit branches : quatre losanges sur les axes, quatre fers en
       diagonale. Tout est obtenu par rotation d'un seul motif, ce qui garantit
       la symetrie exacte. Centre remonte a y=205 pour laisser la barre en bas. -->
  <g transform="translate(256 205)">
    <use href="#omnisLosange"/>
    <use href="#omnisLosange" transform="rotate(90)"/>
    <use href="#omnisLosange" transform="rotate(180)"/>
    <use href="#omnisLosange" transform="rotate(270)"/>

    <use href="#omnisFer" transform="rotate(-45)"/>
    <use href="#omnisFer" transform="rotate(45)"/>
    <use href="#omnisFer" transform="rotate(135)"/>
    <use href="#omnisFer" transform="rotate(225)"/>
  </g>

  <!-- Barre de progression : piste claire puis portion remplie -->
  <rect x="50" y="404" width="412" height="54" rx="27" fill="#ffffff"/>
  <path d="M 77 404 H 300 V 458 H 77 A 27 27 0 0 1 77 404 Z" fill="url(#omnisBarre)"/>
</svg>
